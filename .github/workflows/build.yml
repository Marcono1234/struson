name: Build

on:
  push:
    branches-ignore:
      # Ignore Dependabot branches because it will also open a pull request, which would cause the
      # workflow to redundantly run twice
      - dependabot/**
  pull_request:


permissions:
  contents: read # to fetch code (actions/checkout)

env:
  # Enable colored terminal output, see https://doc.rust-lang.org/cargo/reference/config.html#termcolor
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install cargo-make
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3  #v2.87.16
        with:
          tool: cargo-make@0.37.24

      - name: Build
        # Additionally verify that lockfile was not implicitly updated, see https://github.com/rust-lang/cargo/issues/8207
        run: |
          cargo make
          git diff --exit-code -- Cargo.lock

      - name: Install cargo-hack
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3  #v2.87.16
        with:
          tool: cargo-hack@0.6.42
      # See https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version
      - name: Check 'rust-version' compatibility
        # `--all-targets` is probably not actually needed to ensure that users of the library can use it
        # with 'rust-version' (`--all-targets` includes tests, benches, examples); but for now keep it
        # to ensure that users can also build Struson themselves with that 'rust-version'
        run: cargo hack check --rust-version --workspace --all-targets --all-features --locked
